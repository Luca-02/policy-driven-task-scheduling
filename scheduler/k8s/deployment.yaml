apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: scheduler
  labels:
    app.kubernetes.io/name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      serviceAccountName: scheduler
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: scheduler-config
          configMap:
            name: scheduler-config
        - name: tls
          secret:
            secretName: dataset-service-tls
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: scheduler
          image: scheduler:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          command:
            - /scheduler
            - --config=/etc/kubernetes/scheduler-config.yaml
            - --v=4
          env:
            - name: CRD_GROUP
              value: "policydriven.unimi.it"
            - name: CRD_VERSION
              value: "v1alpha1"
            - name: NODE_PROPERTY_RESOURCE_PLURAL
              value: "nodeproperties"
            - name: DATASET_SERVICE_URL
              value: "https://dataset-service.dataset-service.svc.cluster.local"
            - name: DATASET_SERVICE_CA_FILE
              value: "/tls/ca.crt"
            - name: NODE_PROPERTY_LABEL_PREFIX
              value: "property.node.policydriven.unimi.it/"
            - name: DATASETS_ANNOTATION_KEY
              value: "scheduling.task.policydriven.unimi.it/datasets"
            - name: BETA_STAR_ANNOTATION_KEY
              value: "scheduling.task.policydriven.unimi.it/betaStar"
          ports:
            - name: healthz
              containerPort: 10259
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
              scheme: HTTPS
            initialDelaySeconds: 15
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
              scheme: HTTPS
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scheduler-config
              mountPath: /etc/kubernetes
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true