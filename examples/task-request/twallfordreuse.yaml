# This is an invalid TaskRequest used to test the validation webhook with external data provider.
# IMPORTANT:
# This task is based on the `examples/data/seed_datasets.json` and `examples/data/seed_contexts.json`
# data seeds.
apiVersion: policydriven.unimi.it/v1alpha1
kind: TaskRequest
metadata:
  name: wallfordreuse
  namespace: compute
spec:
  issuer: issuerford # same issuer/context as wallford.yaml
  requirements:
    security: 3
    computation: 3 # same pin: only kind-worker is c_prop-admissible
  datasets:
    - d2ctx # ctx(d2ctx) = {Ford}, same context already on kind-worker
# Apply AFTER wallford.yaml.
# Expected: admitted and scheduled on
# kind-worker too. c_wall: (auth(issuerford) x Lambda(kind-worker)) =
# ({Ford} x {Ford}), and Ford is never in conflict with itself
# (irreflexive) -> no intersection with X_conf. A node already holding
# Ford residue stays a fully legitimate candidate for another
# same-context issuer.
