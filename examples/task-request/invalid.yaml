# This is an invalid TaskRequest used to test the validation webhook with external data provider.
# IMPORTANT:
# This task is based on the `examples/data/seed_datasets.json` and `examples/data/seed_contexts.json`
# data seeds, and the `examples/cluster-config.yaml` cluster configuration.
apiVersion: policydriven.unimi.it/v1alpha1
kind: TaskRequest
metadata:
  name: invalid
  # no namespace 'compute'
spec:
  issuer: issuerford # issuer authorized for {Ford}
  requirements:
    security: 1
    computation: 99 # invalid level for 'computation' property
    pnotexist: 1 # non-existent property
  datasets:
    - d1 # valid dataset
    - d2 # valid dataset
    - d3ctx # dataset with "contexts": {Ferrari, Finance} -> not authorized for issuerford
    - dnotexist1 # non-existent dataset
    - dnotexist2 # non-existent dataset
    - dnotexistprop # dataset with "requirements": {"propnotexist1": 1, "propnotexist2": 3}
    - dnotexistlvl # dataset with "requirements": {"security": 99}
    - dnotexistgeo # dataset with "geo": "geonotexist"
  geo: geonotexist # non-existent geo
