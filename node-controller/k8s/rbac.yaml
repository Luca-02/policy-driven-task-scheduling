apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-controller-service-account
  namespace: node-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-controller-cluster-role
rules:
  # Read and patch nodes 
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
  # Read pods cluster-wide, to check for active pods on a node before sanitizing it
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Watch NodeProperty CRs
  - apiGroups: [policydriven.unimi.it]
    resources: [nodeproperties]
    verbs: [get, list, watch, patch, update]
  # Kopf finalizers and progress annotations require updating the CR
  - apiGroups: [policydriven.unimi.it]
    resources: [nodeproperties/status]
    verbs: [get, patch, update]
  # Kopf posts events about its activity
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  # Kopf uses leases for peer-detection and leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Read CRD definitions to check if the CRD is present before starting the operator
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-controller-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: node-controller-service-account
    namespace: node-controller
roleRef:
  kind: ClusterRole
  name: node-controller-cluster-role
  apiGroup: rbac.authorization.k8s.io