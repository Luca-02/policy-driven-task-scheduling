name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-dataset-service:
    name: Test dataset-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataset-service
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dataset-service/requirements.txt
      - name: Install dependencies
        env:
          PIP_CERT: /etc/ssl/certs/ca-certificates.crt
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-context-service:
    name: Test context-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: context-service
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: context-service/requirements.txt
      - name: Install dependencies
        env:
          PIP_CERT: /etc/ssl/certs/ca-certificates.crt
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-node-controller:
    name: Test node-controller
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-controller
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: node-controller/requirements.txt
      - name: Install dependencies
        env:
          PIP_CERT: /etc/ssl/certs/ca-certificates.crt
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-task-request-controller:
    name: Test task-request-controller
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-request-controller
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: task-request-controller/requirements.txt
      - name: Install dependencies
        env:
          PIP_CERT: /etc/ssl/certs/ca-certificates.crt
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-scheduler:
    name: Test scheduler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true
          cache-dependency-path: scheduler/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Run tests
        run: go test -v ./...

  test-policies:
    name: Test policies
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: "kind-ci"
      DATASET_SERVICE_LIGHT_MODE: "true"
      CONTEXT_SERVICE_LIGHT_MODE: "true"
      CONTROL_PLANE_COUNT: "1"
      WORKER_COUNT: "0"
      NODE_IMAGE: "kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256"
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
      - name: Install gator
        run: go install github.com/open-policy-agent/gatekeeper/v3/cmd/gator@v3.22.2
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v5
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      - name: Initialize cluster
        run: bash scripts/init-cluster.sh
      - name: Populate cluster with example data
        run: bash scripts/populate-cluster-with-examples.sh
      - name: Run policy tests
        run: bash scripts/test-policies.sh all
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -100
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name kind-ci