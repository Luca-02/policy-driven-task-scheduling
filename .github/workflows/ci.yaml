name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-dataset-service:
    name: Test dataset-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dataset-service
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dataset-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-context-service:
    name: Test context-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: context-service
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: context-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-node-controller:
    name: Test node-controller
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-controller
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: node-controller/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-task-request-controller:
    name: Test task-request-controller
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-request-controller
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: task-request-controller/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest tests/ -v

  test-scheduler:
    name: Test scheduler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true
          cache-dependency-path: scheduler/go.sum
      - name: Install dependencies
        run: go mod download
      - name: Build
        run: go build -v ./...
      - name: Run tests
        run: go test -v ./...